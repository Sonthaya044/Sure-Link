<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>{% block title %}SureLink | URL Threat Intelligence{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <style>
        :root {
            --color-primary: 16 163 127; --color-tertiary: 16 163 127; --color-tertiary-container: 209 250 229;
            --color-background: 247 247 248; --color-surface: 255 255 255; --color-surface-container: 244 244 245;
            --color-surface-container-low: 250 250 250; --color-surface-container-highest: 229 231 235;
            --color-surface-bright: 255 255 255; --color-surface-strong: 82 82 91; --color-surface-soft: 228 228 231;
            --color-on-surface: 32 33 35; --color-on-surface-variant: 113 113 122; --color-outline: 228 228 231;
            --color-outline-variant: 161 161 170; --color-error: 220 38 38; --color-warning: 202 138 4; --color-success: 16 163 127;
        }
        html.dark {
            --color-primary: 52 211 153; --color-tertiary: 52 211 153; --color-tertiary-container: 6 78 59;
            --color-background: 33 33 35; --color-surface: 44 44 47; --color-surface-container: 52 53 57;
            --color-surface-container-low: 38 38 41; --color-surface-container-highest: 64 64 67;
            --color-surface-bright: 55 55 59; --color-surface-strong: 161 161 170; --color-surface-soft: 63 63 70;
            --color-on-surface: 236 236 241; --color-on-surface-variant: 172 172 182; --color-outline: 82 82 91;
            --color-outline-variant: 113 113 122; --color-error: 248 113 113; --color-warning: 250 204 21; --color-success: 52 211 153;
        }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .material-symbols-outlined.filled { font-variation-settings: 'FILL' 1; }
        .font-mono, .tech-readout { font-family: 'DM Sans', 'Prompt', sans-serif; }
        .font-headline, .font-body { font-family: 'DM Sans', 'Prompt', sans-serif; }
        .soc-grid { background: rgb(var(--color-background)); }
        .glass-nav { background: rgb(var(--color-surface) / .94); box-shadow: 0 1px 2px rgb(0 0 0 / .05); }
        .glass-panel { background: rgb(var(--color-surface)); box-shadow: 0 1px 3px rgb(0 0 0 / .06), 0 8px 24px rgb(0 0 0 / .035); }
        .hover-lift { transition: border-color .2s ease, box-shadow .2s ease; }
        .hover-lift:hover { transform: none; border-color: rgb(var(--color-primary) / .45); box-shadow: 0 8px 24px rgb(0 0 0 / .08); }
        .hero-orbit { display: none; }
        .target-brackets { position: relative; }
        .target-brackets::before, .target-brackets::after { content: ''; position: absolute; width: 18px; height: 18px; pointer-events: none; }
        .target-brackets::before { left: -1px; top: -1px; border-left: 2px solid rgb(var(--color-primary)); border-top: 2px solid rgb(var(--color-primary)); }
        .target-brackets::after { right: -1px; bottom: -1px; border-right: 2px solid rgb(var(--color-primary)); border-bottom: 2px solid rgb(var(--color-primary)); }
        .radar-sweep { position: relative; display: inline-flex; width: 1.25rem; height: 1.25rem; align-items: center; justify-content: center; border: 1px solid currentColor; border-radius: 999px; font-size: 0 !important; animation: radar-rotate 1.1s linear infinite; }
        .radar-sweep::after { content: ''; position: absolute; width: 50%; height: 1px; right: 50%; top: 50%; transform-origin: right center; background: currentColor; box-shadow: 0 0 5px currentColor; }
        .online-dot { width: .45rem; height: .45rem; border-radius: 999px; background: rgb(var(--color-success)); box-shadow: 0 0 0 4px rgb(var(--color-success) / .12); animation: online-pulse 2s ease-in-out infinite; }
        .threat-card[class~="bg-pink-100"], .threat-card[class~="bg-red-100"] { background: rgb(var(--color-error) / .12); }
        .threat-card[class~="bg-orange-100"], .threat-card[class~="bg-yellow-100"] { background: rgb(var(--color-warning) / .14); }
        .threat-card[class~="bg-green-100"] { background: rgb(var(--color-success) / .12); }
        .threat-card[class~="bg-slate-100"] { background: rgb(var(--color-surface-container-highest) / .5); }
        @keyframes radar-rotate { to { transform: rotate(360deg); } }
        @keyframes online-pulse { 50% { box-shadow: 0 0 0 7px rgb(var(--color-success) / 0); } }
        .page-content { animation: page-in .35s ease both; }
        .page-content h2 { letter-spacing: -0.03em; }
        button, a, input { font-family: inherit; }
        .rounded-3xl { border-radius: 1rem !important; }
        .rounded-2xl { border-radius: .75rem !important; }
        .target-brackets::before, .target-brackets::after { display: none; }
        #scanBtn { background: rgb(var(--color-primary)); color: white; }
        #scanBtn:hover { background: rgb(var(--color-primary) / .9); }
        .scan-search-shell { display: flex; align-items: center; gap: .65rem; min-height: 3.35rem; padding: .4rem .45rem .4rem .9rem; border: 2px solid #10a37f; border-radius: 999px; background: #f1f1f3; transition: border-color .2s ease, box-shadow .2s ease, background .2s ease; }
        .scan-search-shell:focus-within { border-color: #078f70; background: #f8f8fa; box-shadow: 0 0 0 4px rgb(16 163 127 / .14); }
        .scan-search-shell input { min-width: 0; }
        .scan-search-shell input { color: #008f79; font-size: .95rem; font-weight: 500; }
        .scan-search-shell input::placeholder { color: #008f79; opacity: 1; }
        .scan-search-shell input, #scanForm > div:first-child input { border: 0 !important; outline: 0 !important; box-shadow: none !important; background: transparent !important; }
        .scan-search-shell .material-symbols-outlined { color: #10a37f !important; font-size: 1.65rem; }
        .scan-search-button { min-height: 2.75rem !important; border-radius: .7rem !important; box-shadow: 0 8px 18px rgb(var(--color-primary) / .2); }
        .scan-search-button:active { transform: scale(.98); }
        #scanForm > div:first-child { display: flex; align-items: center; gap: .65rem; min-width: 0; min-height: 3.35rem; padding: .4rem .65rem .4rem .9rem; border: 2px solid #10a37f; border-radius: 999px; background: #f1f1f3; transition: border-color .2s ease, box-shadow .2s ease, background .2s ease; }
        #scanForm > div:first-child:focus-within { border-color: #078f70; box-shadow: 0 0 0 4px rgb(16 163 127 / .14); }
        #scanForm > div:first-child input { min-width: 0; color: #008f79; font-size: 1.05rem; font-weight: 500; }
        #scanForm > div:first-child input::placeholder { color: #008f79; opacity: 1; }
        #scanForm > div:first-child .material-symbols-outlined { color: #10a37f !important; font-size: 1.65rem; }
        #scanForm > button { min-height: 2.75rem; border-radius: .7rem; box-shadow: 0 8px 18px rgb(var(--color-primary) / .2); }
        #scanForm > button:active { transform: scale(.98); }
        #scanForm.glass-panel, .glass-panel:has(> #scanForm) { background: transparent; border-color: transparent; box-shadow: none; padding: 0; }
        #page-dashboard { width: 100%; min-height: calc(100vh - 6rem); }
        #page-dashboard > div { width: min(100%, 96rem); }
        #resultContainer { width: 100%; }
        #page-history, #page-dashboard { padding-top: 1.5rem; }
        #page-dashboard .glass-panel, #page-dashboard #mitigationSection, #page-dashboard #fullLogSection { border-radius: 2rem !important; }
        #page-dashboard .rounded-2xl { border-radius: 1.25rem !important; }
        .dashboard-theme { background: radial-gradient(circle at 8% 8%, rgb(16 163 127 / .13), transparent 28%), radial-gradient(circle at 92% 18%, rgb(245 158 11 / .09), transparent 26%); }
        .dashboard-theme .glass-panel { background: rgb(var(--color-surface) / .88); box-shadow: 0 18px 45px rgb(15 23 42 / .06); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
        .dashboard-theme .bg-surface-container { background: rgb(var(--color-surface-container) / .72); }
        .dashboard-theme h2, .dashboard-theme h3 { letter-spacing: -.03em; }
        html.dark .dashboard-theme { background: radial-gradient(circle at 8% 8%, rgb(16 163 127 / .16), transparent 28%), radial-gradient(circle at 92% 18%, rgb(245 158 11 / .08), transparent 26%); }
        html.dark .dashboard-theme .glass-panel { background: rgb(var(--color-surface) / .82); box-shadow: 0 18px 45px rgb(0 0 0 / .18); }
        #page-history { background: radial-gradient(circle at 8% 8%, rgb(16 163 127 / .13), transparent 28%), radial-gradient(circle at 92% 18%, rgb(245 158 11 / .09), transparent 26%); }
        #page-history { width: 100%; min-height: calc(100vh - 6rem); }
        #page-history > div { width: min(100%, 96rem); max-width: none; }
        #page-history .glass-panel { background: rgb(var(--color-surface) / .88); box-shadow: 0 18px 45px rgb(15 23 42 / .06); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
        #page-history h2, #page-history h3 { letter-spacing: -.03em; }
        html.dark #page-history { background: radial-gradient(circle at 8% 8%, rgb(16 163 127 / .16), transparent 28%), radial-gradient(circle at 92% 18%, rgb(245 158 11 / .08), transparent 26%); }
        html.dark #page-history .glass-panel { background: rgb(var(--color-surface) / .82); box-shadow: 0 18px 45px rgb(0 0 0 / .18); }
        #page-dashboard .glass-panel, #page-dashboard #mitigationSection, #page-dashboard #fullLogSection, #page-history .glass-panel { border-color: rgb(212 214 219 / .9) !important; border-width: 1px !important; border-radius: 14px !important; box-shadow: 0 4px 14px rgb(15 23 42 / .08); }
        #page-dashboard .bg-surface-container, #page-history .bg-surface-container { border-color: rgb(var(--color-outline) / .42); }
        #page-dashboard .rounded-2xl, #page-history .rounded-2xl { border-radius: 14px !important; }
        #page-history table thead { border-color: rgb(var(--color-outline) / .5); background: rgb(var(--color-surface-container) / .58); }
        #page-history table tbody tr { border-color: rgb(var(--color-outline) / .38); }
        html.dark #page-dashboard .glass-panel, html.dark #page-dashboard #mitigationSection, html.dark #page-dashboard #fullLogSection, html.dark #page-history .glass-panel { border-color: rgb(93 105 122 / .8) !important; box-shadow: 0 4px 14px rgb(0 0 0 / .22); }
        @media (max-width: 639px) { .scan-search-shell { padding: .5rem .75rem; } .scan-search-button { width: 100%; } }
        table th { font-weight: 600; }
        @keyframes page-in { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        body.modal-open { overflow: hidden; }
    </style>
    <script id="tailwind-config">
        tailwind.config = { darkMode: "class", theme: { extend: { colors: {
            "primary": "rgb(var(--color-primary))", "tertiary": "rgb(var(--color-tertiary))", "background": "rgb(var(--color-background))",
            "surface": "rgb(var(--color-surface))", "surface-container": "rgb(var(--color-surface-container))",
            "surface-container-low": "rgb(var(--color-surface-container-low))", "surface-container-highest": "rgb(var(--color-surface-container-highest))",
            "on-surface": "rgb(var(--color-on-surface))", "on-surface-variant": "rgb(var(--color-on-surface-variant))",
            "outline": "rgb(var(--color-outline))", "error": "rgb(var(--color-error))", "warning": "rgb(var(--color-warning))", "success": "rgb(var(--color-success))"
        }, fontFamily: { "headline": ["DM Sans", "Prompt", "sans-serif"], "body": ["DM Sans", "Prompt", "sans-serif"] } } } }
    </script>
</head>
<body class="bg-background text-on-surface font-body min-h-screen overflow-x-hidden transition-colors duration-300 flex flex-col justify-between soc-grid">
    <nav class="glass-nav fixed inset-x-0 top-0 z-[60] flex w-full items-center justify-between border-b border-outline px-5 py-3 sm:px-8">
        <a href="{{ url_for('index') }}" class="flex items-center gap-2 sm:gap-3 min-w-0 hover:opacity-80 transition-opacity">
                <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-primary text-white">
                <span class="material-symbols-outlined text-xl sm:text-2xl">security</span>
            </div>
            <div class="flex flex-col min-w-0">
                <p class="truncate text-base font-semibold text-on-surface leading-tight">SureLink</p>
                <span class="hidden text-xs text-on-surface-variant sm:block">ตรวจสอบลิงก์อย่างมั่นใจ</span>
            </div>
        </a>
        
        <div class="hidden items-center gap-5 md:flex shrink-0">
            <a href="{{ url_for('index') }}" class="nav-link rounded-lg px-3 py-2 text-sm {% if request.endpoint == 'index' %}bg-surface-container font-semibold text-on-surface{% else %}text-on-surface-variant hover:bg-surface-container{% endif %}">ตรวจสอบลิงก์</a>
            <a href="{{ url_for('history') }}" class="nav-link rounded-lg px-3 py-2 text-sm {% if request.endpoint == 'history' %}bg-surface-container font-semibold text-on-surface{% else %}text-on-surface-variant hover:bg-surface-container{% endif %}">ประวัติ</a>
            <button aria-label="Toggle color theme" onclick="toggleTheme()" class="flex h-9 w-9 items-center justify-center rounded-lg border border-outline bg-surface text-on-surface-variant transition hover:text-primary">
                <span class="material-symbols-outlined" id="themeIconDesktop">dark_mode</span>
            </button>
        </div>

            <button aria-label="Open navigation" onclick="toggleMobileNav()" class="inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-lg border border-outline bg-surface-bright text-on-surface md:hidden">
            <span class="material-symbols-outlined">menu</span>
        </button>

        <div id="mobileNav" class="absolute right-4 top-[110%] hidden w-56 rounded-xl border border-outline bg-surface p-2 shadow-xl md:hidden">
            <a href="{{ url_for('index') }}" class="block w-full rounded-xl px-4 py-3 text-left text-sm font-medium text-on-surface-variant hover:bg-on-surface/5 hover:text-primary transition">หน้าแรก</a>
            <a href="{{ url_for('history') }}" class="block w-full rounded-xl px-4 py-3 text-left text-sm font-medium text-on-surface-variant hover:bg-on-surface/5 hover:text-primary transition">ประวัติ</a>
            <div class="my-1 border-t border-outline/30"></div>
            <button onclick="toggleTheme()" class="w-full flex items-center gap-3 rounded-xl px-4 py-3 text-left text-sm font-medium text-on-surface-variant hover:bg-on-surface/5 hover:text-primary transition">
                <span class="material-symbols-outlined text-[20px]" id="themeIconMobile">dark_mode</span> สลับโหมดสี
            </button>
        </div>
    </nav>

    <main class="pt-[60px] w-full flex-1">
        {% block content %}{% endblock %}
    </main>

    <footer class="border-t border-outline bg-surface-container-low mt-16 w-full">
        <div class="mx-auto flex max-w-7xl flex-col gap-4 px-6 py-6 sm:py-8 text-xs sm:text-sm text-on-surface-variant md:flex-row md:items-center md:justify-between text-center md:text-left">
            <p>© 2026 SureLink ระบบสแกนและประเมินความเสี่ยง URL.</p>
        </div>
    </footer>

    <div id="toast-container" class="fixed bottom-6 right-4 sm:right-6 z-[100] flex flex-col gap-3 pointer-events-none w-[calc(100%-2rem)] sm:w-auto"></div>

    <script src="{{ url_for('static', filename='js/common.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
